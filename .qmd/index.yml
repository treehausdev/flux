global_context: "A second brain: atomic idea pages and entity pages distilled from the owner's conversations."
collections:
  wiki:
    path: ./brain/wiki
    pattern: "**/*.md"
    ignore:
      - personal/**
    context:
      /: Idea pages. One idea per page, in the owner's words, with a Sources footer naming the conversation it came from.
      /entities: "Entity pages: people, organizations, the owner's ventures, and markets. Each has dated Status lines and links to related idea pages."
  personal:
    path: ./brain/wiki/personal
    pattern: "**/*.md"
    includeByDefault: false
    context:
      /: "Private pages: health, family, money. Searched only when asked for by name."
models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
