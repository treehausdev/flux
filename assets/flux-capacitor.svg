<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 296" width="320" height="296" role="img" aria-labelledby="t d">
  <title id="t">A hand sketch of a flux capacitor</title>
  <desc id="d">Three tubes meeting in a Y inside a box, drawn as a rough pencil sketch.</desc>
  <style>
    .ink { fill: none; stroke: #8b9099; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.4; }
  </style>

  <!-- the box, drawn twice and slightly off, the way a quick sketch is -->
  <path class="ink" d="M46 34 C120 30, 208 31, 276 35 C279 110, 278 196, 275 262 C200 266, 116 265, 45 261 C42 190, 43 104, 46 34 Z"/>
  <path class="ink thin" d="M50 39 C124 36, 204 37, 271 40 C273 112, 272 194, 270 257 C198 260, 120 259, 51 256 C49 188, 49 108, 50 39"/>

  <!-- three tubes meeting in the middle -->
  <path class="ink" d="M160 152 C138 126, 112 98, 92 78"/>
  <path class="ink" d="M166 146 C142 120, 118 94, 99 72"/>
  <path class="ink" d="M160 152 C182 126, 208 98, 228 78"/>
  <path class="ink" d="M154 146 C178 120, 202 94, 221 72"/>
  <path class="ink" d="M154 154 C153 180, 154 206, 153 232"/>
  <path class="ink" d="M166 154 C167 180, 166 206, 167 232"/>

  <!-- the ends of the tubes -->
  <path class="ink" d="M84 66 c7 -6, 17 -3, 19 5 c2 8, -6 15, -14 13 c-8 -2, -11 -12, -5 -18"/>
  <path class="ink" d="M236 66 c-7 -6, -17 -3, -19 5 c-2 8, 6 15, 14 13 c8 -2, 11 -12, 5 -18"/>
  <path class="ink" d="M149 236 c1 -9, 12 -13, 19 -8 c7 5, 6 16, -2 20 c-8 4, -18 -3, -17 -12"/>

  <!-- the centre, and a little energy -->
  <path class="ink" d="M152 150 c3 -7, 13 -8, 17 -2 c4 6, 0 14, -8 14 c-7 0, -11 -6, -9 -12"/>
  <path class="ink thin" d="M127 150 l-9 -3 M193 150 l9 -3 M160 122 l0 -9 M138 172 l-6 7 M182 172 l6 7"/>

</svg>
